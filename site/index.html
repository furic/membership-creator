<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membership</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<!-- Text comes from locales/<locale>.json through the data-i18n* attributes; club details from config.json. -->
<body>
  <div class="app no-print">
    <header class="top">
      <img id="club-logo" class="logo" alt="" hidden>
      <div class="brand"><span id="club-name"></span><small data-i18n="app.title"></small></div>
      <nav class="tabs" hidden>
        <button type="button" data-view="issue" class="tab" data-i18n="tab.issue"></button>
        <button type="button" data-view="register" class="tab" data-i18n="tab.register"></button>
        <button type="button" data-view="settings" class="tab" data-i18n="tab.settings"></button>
      </nav>
    </header>

    <p id="status" class="status" role="status" hidden></p>

    <section id="view-login" class="view" hidden>
      <form id="login-form" class="panel narrow">
        <h1 data-i18n="login.title"></h1>
        <label><span data-i18n="login.label"></span>
          <input id="login-code" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="error" hidden></p>
        <button type="submit" class="primary" data-i18n="login.submit"></button>
      </form>
    </section>

    <section id="view-issue" class="view" hidden>
      <div class="panel">
        <h1 data-i18n="issue.title"></h1>
        <div class="form-grid">
          <label><span data-i18n="issue.names"></span>
            <textarea id="names" rows="8" data-i18n-placeholder="issue.namesPlaceholder"></textarea>
          </label>
          <div>
            <label><span data-i18n="issue.expiry"></span>
              <input id="expiry" type="date">
            </label>
            <label class="check lifetime-check"><input id="lifetime" type="checkbox"> <span data-i18n="member.lifetimeOption"></span></label>
            <p class="hint" id="expiry-hint"></p>
            <p class="hint" id="count-hint"></p>
            <p class="hint"><span data-i18n="issue.nextNumber"></span><strong id="next-number">—</strong><span data-i18n="issue.nextNumberNote"></span></p>
            <div class="actions">
              <button type="button" id="issue-btn" class="primary" disabled data-i18n="issue.confirm"></button>
              <button type="button" id="print-btn" class="primary" hidden data-i18n="issue.print"></button>
              <button type="button" id="new-batch-btn" hidden data-i18n="issue.newBatch"></button>
            </div>
            <p class="hint" id="issued-msg"></p>
            <p class="hint print-tip" data-i18n="issue.printTip"></p>
          </div>
        </div>
      </div>
      <h2 class="preview-title" data-i18n="issue.preview"></h2>
      <div id="issue-preview" class="preview"></div>
    </section>

    <section id="view-register" class="view" hidden>
      <div class="panel">
        <h1 data-i18n="register.title"></h1>
        <div class="toolbar">
          <input id="search" type="search" data-i18n-placeholder="register.search">
          <button type="button" id="reprint-btn" class="primary" disabled data-i18n="register.reprint"></button>
        </div>
        <p class="hint print-tip" data-i18n="register.printTip"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th><input id="select-all" type="checkbox" data-i18n-label="register.selectAll"></th>
                <th data-i18n="register.colNumber"></th><th data-i18n="register.colName"></th><th data-i18n="register.colIssued"></th><th data-i18n="register.colExpiry"></th><th data-i18n="register.colActions"></th>
              </tr>
            </thead>
            <tbody id="members"></tbody>
          </table>
          <p id="empty" class="hint" hidden data-i18n="register.empty"></p>
        </div>
      </div>

      <dialog id="edit-dialog" class="edit-dialog">
        <form id="edit-form" method="dialog">
          <h1 data-i18n="edit.title"></h1>
          <label><span data-i18n="edit.number"></span>
            <input id="edit-number" type="text" inputmode="numeric" pattern="\d{1,5}" maxlength="5" required>
          </label>
          <label><span data-i18n="edit.name"></span>
            <input id="edit-name" type="text" maxlength="30" required>
          </label>
          <label><span data-i18n="edit.expiry"></span>
            <input id="edit-expiry" type="date">
          </label>
          <label class="check"><input id="edit-lifetime" type="checkbox"> <span data-i18n="member.lifetimeOption"></span></label>
          <p class="hint" id="edit-hint"></p>
          <p id="edit-error" class="error" hidden></p>
          <div class="actions">
            <button type="submit" class="primary" value="save" data-i18n="edit.save"></button>
            <button type="button" id="edit-cancel" data-i18n="edit.cancel"></button>
          </div>
        </form>
      </dialog>
    </section>

    <section id="view-settings" class="view" hidden>
      <div class="settings">
        <form id="next-form" class="panel">
          <h1 data-i18n="settings.nextTitle"></h1>
          <p class="hint" data-i18n="settings.nextHint"></p>
          <label><span data-i18n="settings.nextLabel"></span>
            <input id="next-input" type="text" inputmode="numeric" pattern="\d{1,5}" maxlength="5" required>
          </label>
          <p id="next-error" class="error" hidden></p>
          <div class="actions"><button type="submit" class="primary" data-i18n="settings.save"></button></div>
        </form>

        <form id="passcode-form" class="panel">
          <h1 data-i18n="settings.pcTitle"></h1>
          <p class="hint" data-i18n="settings.pcHint"></p>
          <input id="pc-username" type="text" autocomplete="username" hidden>
          <label><span data-i18n="settings.pcCurrent"></span>
            <input id="pc-current" type="password" autocomplete="current-password" required>
          </label>
          <label><span data-i18n="settings.pcNext"></span>
            <input id="pc-next" type="password" autocomplete="new-password" minlength="6" maxlength="64" required>
          </label>
          <label><span data-i18n="settings.pcConfirm"></span>
            <input id="pc-confirm" type="password" autocomplete="new-password" minlength="6" maxlength="64" required>
          </label>
          <p class="hint" data-i18n="settings.pcRule"></p>
          <p id="pc-error" class="error" hidden></p>
          <div class="actions"><button type="submit" class="primary" data-i18n="settings.pcSubmit"></button></div>
        </form>
      </div>
    </section>
  </div>

  <div id="print-root" class="print-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
