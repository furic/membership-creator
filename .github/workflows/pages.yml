name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test page helpers
        run: npm test
        working-directory: site
      # Optional: a fork can keep its club settings in a repository variable (Settings → Secrets and
      # variables → Actions → Variables → SITE_CONFIG, the whole config.json) instead of editing the file.
      - name: Use the SITE_CONFIG variable as config.json
        if: vars.SITE_CONFIG != ''
        env:
          SITE_CONFIG: ${{ vars.SITE_CONFIG }}
        run: |
          printf '%s' "$SITE_CONFIG" > site/config.json
          node -e "JSON.parse(require('fs').readFileSync('site/config.json', 'utf8'))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
